# 喷涂质检 Agent V1.0 基础设施：PostgreSQL 16 + Redis-Stack + MinIO
# 用法（项目根目录）: docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: spray-qc-postgres
    environment:
      POSTGRES_DB: spray_qc
      POSTGRES_USER: spray
      POSTGRES_PASSWORD: spray_qc_2026
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spray -d spray_qc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-stack:
    image: redis/redis-stack-server:7.4-v0
    container_name: spray-qc-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: spray-qc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data: {}
  redis_data: {}
  minio_data: {}
